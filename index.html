<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Website mẫu có thể thêm vào màn hình chính.">
  <link rel="manifest" href="./manifest.json">
  <title>Ứng dụng của tôi</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #f1f5f9; color: #0f172a; }
    main { max-width: 680px; margin: 0 auto; padding: 32px 20px; }
    .card { background: white; padding: 24px; border-radius: 20px; box-shadow: 0 8px 28px #0f172a12; }
    .logo { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 18px; background: #dbeafe; font-size: 32px; }
    h1 { margin-bottom: 8px; }
    p { line-height: 1.6; color: #475569; }
    button { border: 0; border-radius: 12px; padding: 12px 16px; background: #2563eb; color: white; font: inherit; font-weight: 650; }
    #status { margin-top: 14px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="logo" aria-hidden="true">📱</div>
      <h1>Ứng dụng của tôi</h1>
      <p>Xin chào! Đây là website mẫu đã sẵn sàng để xuất bản bằng GitHub Pages và có thể thêm vào màn hình chính.</p>
      <button id="helloButton" type="button">Bấm thử</button>
      <p id="status" role="status">Trạng thái: đang tải…</p>
    </section>
  </main>
  <script>
    const status = document.getElementById("status");
    document.getElementById("helloButton").addEventListener("click", () => {
      status.textContent = "Hoạt động tốt! Bạn đã bấm nút thành công.";
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(() => { status.textContent = "Website đã tải xong. Hỗ trợ lưu bộ nhớ đệm đã được bật."; })
          .catch(() => { status.textContent = "Website vẫn hoạt động, nhưng chưa đăng ký được bộ nhớ đệm."; });
      });
    } else {
      status.textContent = "Website hoạt động, nhưng trình duyệt này không hỗ trợ Service Worker.";
    }
  </script>
</body>
</html>
